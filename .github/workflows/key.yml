name: key

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  key:
    name: Generate the key the archive is signed with
    runs-on: ubuntu-latest
    steps:
      - id: held
        name: Keep the key the archive already signs with
        env:
          HELD: ${{ secrets.ARCHIVE_SIGNING_KEY != '' }}
        run: |
          echo "held=$HELD" >> "$GITHUB_OUTPUT"
          if [ "$HELD" = true ]; then
            echo "ARCHIVE_SIGNING_KEY is already set; the archive keeps the key it is signed with"
          fi

      - if: steps.held.outputs.held != 'true'
        uses: actions/checkout@v4

      - name: Generate App Token
        if: steps.held.outputs.held != 'true'
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HEMMING_APP_ID }}
          private-key: ${{ secrets.HEMMING_PRIVATE_KEY }}

      - name: Generate and store the signing key
        if: steps.held.outputs.held != 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          set -euo pipefail

          secret=$(mktemp)
          trap 'rm -f "$secret"' EXIT

          bash scripts/generate-key.sh > "$secret"
          test -s "$secret"

          gh secret set ARCHIVE_SIGNING_KEY --repo "$GITHUB_REPOSITORY" < "$secret"
          gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^ARCHIVE_SIGNING_KEY[[:space:]]'
